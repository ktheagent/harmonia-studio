name: Validate Harmonia Studio Windows Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-and-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . pyinstaller

      - name: Run tests
        run: python scripts/ci_unittest.py

      - name: Compile source
        run: python -m compileall harmonia_studio

      - name: Smoke import
        run: python -c "import harmonia_studio; import harmonia_studio.app; import harmonia_studio.resilient_app; import harmonia_studio.cli"

      - name: Build Windows executable
        run: pyinstaller --noconfirm --windowed --name Harmonia-Studio harmonia_studio_launcher.py

      - name: Smoke packaged Windows executable
        shell: pwsh
        run: |
          $env:HARMONIA_STARTUP_SMOKE = "1"
          $env:HARMONIA_SMOKE_MS = "1500"
          $report = Join-Path $PWD "harmonia-startup-smoke.txt"
          $env:HARMONIA_SMOKE_REPORT = $report
          Remove-Item $report -ErrorAction SilentlyContinue
          $exe = Join-Path $PWD "dist\Harmonia-Studio\Harmonia-Studio.exe"
          if (-not (Test-Path $exe)) {
            throw "Packaged executable not found: $exe"
          }
          $process = Start-Process -FilePath $exe -PassThru
          if (-not $process.WaitForExit(15000)) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            if (Test-Path $report) {
              Write-Host "---- Harmonia startup smoke report ----"
              Get-Content $report
              Write-Host "---------------------------------------"
            }
            throw "Packaged executable did not complete startup smoke test within 15 seconds"
          }
          if (Test-Path $report) {
            Write-Host "---- Harmonia startup smoke report ----"
            Get-Content $report
            Write-Host "---------------------------------------"
          } else {
            throw "Packaged executable exited without writing a startup smoke report"
          }
          if ($process.ExitCode -ne 0) {
            throw "Packaged executable startup smoke failed with exit code $($process.ExitCode)"
          }
          $firstLine = (Get-Content $report | Select-Object -First 1).Trim()
          if ($firstLine -ne "OK") {
            throw "Packaged executable smoke report did not confirm successful startup"
          }
          Write-Host "Packaged executable startup smoke passed"

      - name: Read package version
        id: package
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Package portable Windows build
        shell: pwsh
        run: |
          $version = "${{ steps.package.outputs.version }}"
          $zip = "Harmonia-Studio-$version-Windows-Portable.zip"
          Compress-Archive -Path "dist/Harmonia-Studio/*" -DestinationPath $zip -Force
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower()
          "$hash  $zip" | Set-Content -Encoding ascii SHA256SUMS-Windows.txt

      - uses: actions/upload-artifact@v6
        with:
          name: Harmonia-Studio-${{ steps.package.outputs.version }}-Windows
          path: |
            Harmonia-Studio-${{ steps.package.outputs.version }}-Windows-Portable.zip
            SHA256SUMS-Windows.txt
          if-no-files-found: error
